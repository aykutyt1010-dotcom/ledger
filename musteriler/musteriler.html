<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Ledger" />
    <meta name="theme-color" content="#263B73" />
    <link rel="manifest" href="../manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="../icons/icon-192.png" />
    <link rel="apple-touch-icon" href="../icons/apple-touch-icon.png" />
    <title>Ledger - Müşteriler</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@100;200;300;400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@100;200;300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../assets/ledger.css" />
    <link rel="stylesheet" href="../assets/okunabilirlik.css" />
    <script src="../assets/ledger-icons.js"></script>
    <script src="../assets/iconify-icon.min.js" defer></script>
    <style>
      @theme inline {
        --color-background: var(--background);
        --color-foreground: var(--foreground);
        --color-primary: var(--primary);
        --color-primary-foreground: var(--primary-foreground);
        --color-secondary: var(--secondary);
        --color-secondary-foreground: var(--secondary-foreground);
        --color-muted: var(--muted);
        --color-muted-foreground: var(--muted-foreground);
        --color-accent: var(--accent);
        --color-accent-foreground: var(--accent-foreground);
        --color-destructive: var(--destructive);
        --color-card: var(--card);
        --color-card-foreground: var(--card-foreground);
        --color-popover: var(--popover);
        --color-popover-foreground: var(--popover-foreground);
        --color-border: var(--border);
        --color-input: var(--input);
        --color-ring: var(--ring);
        --color-chart-1: var(--chart-1);
        --color-chart-2: var(--chart-2);
        --color-chart-3: var(--chart-3);
        --color-chart-4: var(--chart-4);
        --color-chart-5: var(--chart-5);

        --font-font-sans: var(--font-sans);
        --font-font-heading: var(--font-heading);
        --font-font-serif: var(--font-serif);
        --font-font-mono: var(--font-mono);
      }

      @theme {
        --radius-xs: calc(var(--radius) - 8px);
        --radius-sm: calc(var(--radius) - 4px);
        --radius-md: calc(var(--radius) - 2px);
        --radius-lg: var(--radius);
        --radius-xl: calc(var(--radius) + 4px);
        --radius-2xl: calc(var(--radius) + 8px);
        --radius-3xl: calc(var(--radius) + 16px);
        --radius-4xl: calc(var(--radius) + 24px);
      }

      * {
        corner-shape: var(--shape, round);
      }

      .rounded-full, .rounded-none,
      .rounded-t-full, .rounded-t-none,
      .rounded-r-full, .rounded-r-none,
      .rounded-b-full, .rounded-b-none,
      .rounded-l-full, .rounded-l-none,
      .rounded-s-full, .rounded-s-none,
      .rounded-e-full, .rounded-e-none,
      .rounded-tl-full, .rounded-tl-none,
      .rounded-tr-full, .rounded-tr-none,
      .rounded-bl-full, .rounded-bl-none,
      .rounded-br-full, .rounded-br-none,
      .rounded-ss-full, .rounded-ss-none,
      .rounded-se-full, .rounded-se-none,
      .rounded-es-full, .rounded-es-none,
      .rounded-ee-full, .rounded-ee-none {
        corner-shape: round;
      }

      @utility rounded-* {
        border-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-t-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-r-* {
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-b-* {
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-l-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-tl-* {
        border-top-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-tr-* {
        border-top-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-bl-* {
        border-bottom-left-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-br-* {
        border-bottom-right-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-s-* {
        border-start-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-end-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-e-* {
        border-start-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
        border-end-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-ss-* {
        border-start-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-se-* {
        border-start-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-es-* {
        border-end-start-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }
      @utility rounded-ee-* {
        border-end-end-radius: calc(--value(--radius-*, [length], [percentage]) * var(--shape-multiplier, 1));
      }

      :root {
        --shape: squircle;
        --shape-multiplier: 1;

          --background: #F7F8FA;
        --foreground: #172033;
        --primary: #263B73;
        --primary-foreground: #FFFFFF;
        --secondary: #E8EDF7;
        --secondary-foreground: #263B73;
        --muted: #E8EBF0;
        --muted-foreground: #667085;
        --accent: #DDF6EF;
        --accent-foreground: #087F68;
        --destructive: #E4573D;
        --card: #FFFFFF;
        --card-foreground: #172033;
        --popover: #FFFFFF;
        --popover-foreground: #172033;
        --border: #E3E7EE;
        --input: #F1F3F6;
        --ring: #526DB5;
        --chart-1: #263B73;
        --chart-2: #11A683;
        --chart-3: #E4573D;
        --chart-4: #F2B84B;
        --chart-5: #7B61A8;

        --font-sans: "DM Sans";
        --font-heading: "DM Sans";
        --font-serif: "Playfair Display";
        --font-mono: "JetBrains Mono";

        --radius: 0.875rem;
      }

      @supports (corner-shape: squircle) {
        :root {
          --shape-multiplier: 2.5;
        }
      }

      /* Prevent layout shift for icons without explicit dimensions */
      iconify-icon:not([width]):not([height]) {
        display: inline-block;
        width: 1em;
        height: 1em;
      }

      /* Hide scrollbars */
      *,
      *::before,
      *::after {
        scrollbar-width: none;
        -ms-overflow-style: none;
      }
      *::-webkit-scrollbar {
        display: none;
      }
    </style>
    <script src="../db.js"></script>
  </head>
  <body>
    <div class="min-h-screen bg-background text-foreground pb-10">
      <main class="mx-auto w-full max-w-md px-5 pt-7">
        <header class="flex items-center justify-between">
          <div class="flex items-center gap-3">
            <button
              onclick="location.href='../ana-sayfa/ana-sayfa.html'"
              class="flex size-9 items-center justify-center rounded-full bg-card shadow-sm ring-1 ring-border text-foreground hover:bg-black/5 transition"
              aria-label="Ana Sayfa"
            >
              <iconify-icon icon="solar:alt-arrow-left-linear" width="20" height="20"></iconify-icon>
            </button>
            <div>
              <p class="text-xs font-medium text-muted-foreground">Veresiye Kayıtları</p>
              <h1 id="musterilerTitle" class="font-heading mt-0.5 text-xl font-semibold tracking-tight">Müşteriler</h1>
            </div>
          </div>
          <button
            onclick="openYeniMusteriModal()"
            class="flex items-center gap-1.5 rounded-xl bg-primary px-3.5 py-2 text-xs font-semibold text-primary-foreground shadow-sm hover:opacity-95 transition active:scale-95"
          >
            <iconify-icon icon="solar:user-plus-linear" width="16" height="16"></iconify-icon>Yeni Müşteri
          </button>
        </header>
        <div class="relative mt-5">
          <iconify-icon
            icon="solar:magnifer-linear"
            class="absolute left-3.5 top-1/2 -translate-y-1/2 text-muted-foreground"
            width="20"
            height="20"
          ></iconify-icon
          ><input
            type="search"
            id="searchInput"
            oninput="renderMusteriler()"
            placeholder="Müşteri adı veya telefon ile ara..."
            class="w-full rounded-xl bg-input py-3 pl-11 pr-4 text-sm font-medium placeholder:text-muted-foreground focus:outline-none focus:ring-2 focus:ring-primary/20"
          />
        </div>
        <section id="musterilerContainer" class="mt-5 space-y-3">
          <!-- JS ile dinamik dolacak -->
        </section>
      </main>
    </div>
    
    <!-- Yeni Müşteri Ekle Modalı -->
    <div id="yeniMusteriModal" class="hidden fixed inset-0 z-50 flex items-end justify-center bg-foreground/40 backdrop-blur-sm sm:items-center">
      <div class="w-full max-w-md rounded-t-3xl bg-background p-6 shadow-2xl sm:rounded-3xl">
        <div class="mb-5 flex items-center justify-between">
          <h3 class="font-heading text-xl font-semibold">Yeni Müşteri</h3>
          <button onclick="closeYeniMusteriModal()" class="flex size-8 items-center justify-center rounded-full bg-input text-muted-foreground hover:bg-black/5 transition">
            <iconify-icon icon="solar:close-circle-linear" width="20" height="20"></iconify-icon>
          </button>
        </div>
        <form onsubmit="handleMusteriEkle(event)" class="space-y-4">
          <div>
            <label class="mb-1.5 block text-xs font-semibold text-muted-foreground">Ad Soyad / Firma Adı</label>
            <input type="text" id="yeniMusteriAd" required class="w-full rounded-xl bg-card py-3 px-4 text-sm font-medium shadow-sm ring-1 ring-border focus:outline-none focus:ring-2 focus:ring-primary/20" placeholder="Örn: Ahmet Yılmaz">
          </div>
          <div>
            <label class="mb-1.5 block text-xs font-semibold text-muted-foreground">Telefon</label>
            <input type="tel" id="yeniMusteriTel" class="w-full rounded-xl bg-card py-3 px-4 text-sm font-medium shadow-sm ring-1 ring-border focus:outline-none focus:ring-2 focus:ring-primary/20" placeholder="05XX XXX XX XX">
          </div>
          <button type="submit" class="w-full rounded-xl bg-primary py-3.5 text-sm font-semibold text-primary-foreground shadow-lg shadow-primary/20 active:scale-[.99]">
            Müşteriyi Kaydet
          </button>
        </form>
      </div>
    </div>

    <!-- Müşteriye Özel İşlem (Ödeme Al / Hizmet Ekle) Modalı -->
    <div id="islemModal" class="hidden fixed inset-0 z-50 flex items-end justify-center bg-foreground/40 backdrop-blur-sm sm:items-center">
      <div class="w-full max-w-md rounded-t-3xl bg-background p-6 shadow-2xl sm:rounded-3xl">
        <div class="mb-4 flex items-center justify-between">
          <div>
            <span id="islemModalBadge" class="inline-block rounded-full bg-accent px-2.5 py-0.5 text-[11px] font-semibold text-accent-foreground">Ödeme Al</span>
            <h3 id="islemModalMusteriAd" class="font-heading mt-1 text-xl font-semibold">Müşteri Adı</h3>
            <p id="islemModalMevcutBakiye" class="text-xs text-muted-foreground mt-0.5">Mevcut Bakiye: ₺0,00</p>
          </div>
          <button type="button" onclick="closeIslemModal()" class="flex size-8 items-center justify-center rounded-full bg-input text-muted-foreground hover:bg-black/5 transition">
            <iconify-icon icon="solar:close-circle-linear" width="20" height="20"></iconify-icon>
          </button>
        </div>

        <!-- İşlem Tipi Geçişi (Ödeme Al / Hizmet Ekle) -->
        <div class="mb-4 grid grid-cols-2 rounded-xl bg-input p-1">
          <button
            type="button"
            id="modalBtnOdeme"
            onclick="switchModalTip('odeme')"
            class="rounded-lg bg-card py-2 text-xs font-semibold text-chart-2 shadow-sm transition-colors"
          >
            Ödeme Al
          </button>
          <button
            type="button"
            id="modalBtnHizmet"
            onclick="switchModalTip('hizmet')"
            class="rounded-lg py-2 text-xs font-semibold text-muted-foreground transition-colors"
          >
            Hizmet Ekle (Yeni Borç)
          </button>
        </div>

        <form onsubmit="handleIslemKaydet(event)" class="space-y-4">
          <input type="hidden" id="islemModalMusteriId" value="">
          <div>
            <label class="mb-1.5 block text-xs font-semibold text-muted-foreground">Tutar (TL)</label>
            <div class="relative">
              <span class="absolute left-4 top-1/2 -translate-y-1/2 text-lg font-bold text-muted-foreground">₺</span>
              <input
                type="number"
                id="islemModalTutar"
                step="0.01"
                min="0.01"
                required
                placeholder="0.00"
                inputmode="decimal"
                class="w-full rounded-xl bg-card py-3.5 pl-9 pr-4 text-xl font-bold tabular-nums text-foreground shadow-sm ring-1 ring-border focus:outline-none focus:ring-2 focus:ring-primary/20"
              />
            </div>
          </div>
          <!-- Hızlı Tutar Butonları -->
          <div class="flex gap-2 text-xs font-medium">
            <button type="button" onclick="modalHizliTutar(100)" class="rounded-lg bg-input px-3 py-1.5 text-foreground hover:bg-black/5 transition">+₺100</button>
            <button type="button" onclick="modalHizliTutar(250)" class="rounded-lg bg-input px-3 py-1.5 text-foreground hover:bg-black/5 transition">+₺250</button>
            <button type="button" onclick="modalHizliTutar(500)" class="rounded-lg bg-input px-3 py-1.5 text-foreground hover:bg-black/5 transition">+₺500</button>
            <button type="button" onclick="modalHizliTutar(1000)" class="rounded-lg bg-input px-3 py-1.5 text-foreground hover:bg-black/5 transition">+₺1.000</button>
          </div>
          <div>
            <label class="mb-1.5 block text-xs font-semibold text-muted-foreground">Açıklama</label>
            <input
              type="text"
              id="islemModalAciklama"
              placeholder="Örn: Nakit Tahsilat veya Hizmet Bedeli"
              class="w-full rounded-xl bg-card py-3 px-4 text-sm font-medium shadow-sm ring-1 ring-border focus:outline-none focus:ring-2 focus:ring-primary/20"
            />
          </div>
          <div>
            <label class="mb-1.5 block text-xs font-semibold text-muted-foreground">İşlem Tarihi</label>
            <input
              type="date"
              id="islemModalTarih"
              required
              class="w-full rounded-xl bg-card py-2.5 px-3 text-xs font-semibold shadow-sm ring-1 ring-border focus:outline-none focus:ring-2 focus:ring-primary/20"
            />
          </div>
          <button
            type="submit"
            id="islemModalSubmitBtn"
            class="w-full rounded-xl bg-primary py-3.5 text-sm font-semibold text-primary-foreground shadow-lg shadow-primary/20 active:scale-[.99] transition-all"
          >
            İşlemi Müşteri Hesabına Kaydet
          </button>
        </form>
      </div>
    </div>

    <script>
      let allMusteriler = [];
      let currentModalTip = 'odeme';

      function openYeniMusteriModal() {
        document.getElementById('yeniMusteriModal').classList.remove('hidden');
      }

      function closeYeniMusteriModal() {
        document.getElementById('yeniMusteriModal').classList.add('hidden');
      }

      async function handleMusteriEkle(e) {
        e.preventDefault();
        const ad = document.getElementById('yeniMusteriAd').value;
        const tel = document.getElementById('yeniMusteriTel').value;
        await musteriEkle(ad, tel);
        closeYeniMusteriModal();
        e.target.reset();
        loadMusteriler();
      }

      function openIslemModal(musteriId, tip = 'odeme') {
        const m = allMusteriler.find(x => x.id === musteriId);
        if(!m) return;

        document.getElementById('islemModalMusteriId').value = m.id;
        document.getElementById('islemModalMusteriAd').innerText = m.ad;
        
        const bakiyeDurumu = m.netBakiyeKurus > 0 ? " (Borçlu)" : (m.netBakiyeKurus < 0 ? " (Alacaklı)" : " (Bakiye Sıfır)");
        document.getElementById('islemModalMevcutBakiye').innerText = `Mevcut Bakiye: ${formatCurrency(Math.abs(m.netBakiyeKurus))}${bakiyeDurumu}`;
        
        document.getElementById('islemModalTutar').value = '';
        document.getElementById('islemModalTarih').value = new Date().toISOString().split('T')[0];

        switchModalTip(tip);
        document.getElementById('islemModal').classList.remove('hidden');
        setTimeout(() => document.getElementById('islemModalTutar').focus(), 50);
      }

      function closeIslemModal() {
        document.getElementById('islemModal').classList.add('hidden');
      }

      function switchModalTip(tip) {
        currentModalTip = tip;
        const btnOdeme = document.getElementById('modalBtnOdeme');
        const btnHizmet = document.getElementById('modalBtnHizmet');
        const badge = document.getElementById('islemModalBadge');
        const submitBtn = document.getElementById('islemModalSubmitBtn');
        const aciklamaInput = document.getElementById('islemModalAciklama');

        if(tip === 'odeme') {
          btnOdeme.className = 'rounded-lg bg-card py-2 text-xs font-semibold text-chart-2 shadow-sm transition-colors';
          btnHizmet.className = 'rounded-lg py-2 text-xs font-semibold text-muted-foreground transition-colors';
          badge.className = 'inline-block rounded-full bg-accent px-2.5 py-0.5 text-[11px] font-semibold text-accent-foreground';
          badge.innerText = 'Tahsilat (Ödeme Al)';
          submitBtn.innerText = 'Tahsilatı Müşteri Hesabına Kaydet';
          if(!aciklamaInput.value || aciklamaInput.value === 'Hizmet Bedeli') {
            aciklamaInput.value = 'Tahsilat';
          }
        } else {
          btnHizmet.className = 'rounded-lg bg-card py-2 text-xs font-semibold text-chart-3 shadow-sm transition-colors';
          btnOdeme.className = 'rounded-lg py-2 text-xs font-semibold text-muted-foreground transition-colors';
          badge.className = 'inline-block rounded-full bg-[#FCE8E4] px-2.5 py-0.5 text-[11px] font-semibold text-chart-3';
          badge.innerText = 'Hizmet Ekle (Yeni Borç Kaydı)';
          submitBtn.innerText = 'Hizmeti Müşteri Hesabına Kaydet';
          if(!aciklamaInput.value || aciklamaInput.value === 'Tahsilat') {
            aciklamaInput.value = 'Hizmet Bedeli';
          }
        }
      }

      function modalHizliTutar(miktar) {
        const input = document.getElementById('islemModalTutar');
        let current = parseFloat(input.value) || 0;
        input.value = (current + miktar).toFixed(2);
      }

      async function handleIslemKaydet(e) {
        e.preventDefault();
        const musteriId = parseInt(document.getElementById('islemModalMusteriId').value);
        const tutarTL = parseFloat(document.getElementById('islemModalTutar').value);
        const aciklama = document.getElementById('islemModalAciklama').value || (currentModalTip === 'odeme' ? 'Tahsilat' : 'Hizmet Bedeli');
        const tarih = document.getElementById('islemModalTarih').value;

        if(!musteriId) return alert('Müşteri seçilemedi.');
        if(isNaN(tutarTL) || tutarTL <= 0) return alert('Lütfen geçerli bir tutar girin.');

        await islemEkle(musteriId, currentModalTip, tutarTL, aciklama, tarih);
        closeIslemModal();
        await loadMusteriler();
      }

      async function loadMusteriler() {
        allMusteriler = await getMusteriBakiyeleri();
        document.getElementById('musterilerTitle').innerText = `Müşteriler (${allMusteriler.length})`;
        renderMusteriler();
      }

      function renderMusteriler() {
        const query = document.getElementById('searchInput').value.toLowerCase().trim();
        let filtered = allMusteriler.filter(m => m.ad.toLowerCase().includes(query) || (m.telefon && m.telefon.includes(query)));

        const container = document.getElementById('musterilerContainer');
        container.innerHTML = '';
        
        if(filtered.length === 0) {
          container.innerHTML = '<p class="text-sm text-center text-muted-foreground py-10">Müşteri bulunamadı.</p>';
          return;
        }

        filtered.forEach(m => {
          const isAlacakli = m.netBakiyeKurus <= 0;
          const barColor = isAlacakli ? 'bg-chart-2' : 'bg-chart-3';
          const avatarBgColor = isAlacakli ? 'bg-accent' : 'bg-[#FCE8E4]';
          const avatarTextColor = isAlacakli ? 'text-accent-foreground' : 'text-chart-3';
          const amountColor = isAlacakli ? 'text-chart-2' : 'text-chart-3';

          container.innerHTML += `
          <div class="rounded-2xl bg-card p-4 shadow-sm ring-1 ring-border">
            <div onclick="location.href='../raporlar/raporlar.html?musteriId=${m.id}'" class="cursor-pointer flex items-start justify-between hover:opacity-90 active:scale-[.99] transition-all" title="Hesap Dökümünü Gör">
              <div class="flex items-center gap-3">
                <span class="h-12 w-1.5 rounded-full ${barColor}"></span>
                <div class="flex size-11 items-center justify-center rounded-full ${avatarBgColor} font-semibold ${avatarTextColor}">
                  ${getInitials(m.ad)}
                </div>
                <div>
                  <div class="flex items-center gap-1">
                    <p class="text-sm font-semibold text-foreground">${m.ad}</p>
                    <iconify-icon icon="solar:alt-arrow-right-linear" class="text-muted-foreground/60" width="14" height="14"></iconify-icon>
                  </div>
                  <p class="text-xs text-muted-foreground">${m.telefon || 'Tel Yok'}</p>
                </div>
              </div>
              <div class="text-right">
                <p class="font-heading text-base font-semibold tabular-nums ${amountColor}">
                  ${formatCurrency(Math.abs(m.netBakiyeKurus))}
                </p>
                <p class="text-xs text-muted-foreground">Son işlem: ${formatRelativeDate(m.sonIslemTarihi)}</p>
              </div>
            </div>
            <div class="mt-3.5 flex items-center gap-2 border-t border-border pt-3">
              <button onclick="openIslemModal(${m.id}, 'odeme')" class="flex flex-1 items-center justify-center gap-1.5 rounded-lg bg-input py-2 text-xs font-semibold text-chart-2 hover:bg-black/5 transition-colors">
                <iconify-icon icon="solar:card-recive-linear" class="text-chart-2" width="16" height="16"></iconify-icon> Ödeme Al
              </button>
              <button onclick="openIslemModal(${m.id}, 'hizmet')" class="flex flex-1 items-center justify-center gap-1.5 rounded-lg bg-input py-2 text-xs font-semibold text-chart-3 hover:bg-black/5 transition-colors">
                <iconify-icon icon="solar:card-send-linear" class="text-chart-3" width="16" height="16"></iconify-icon> Hizmet Ekle
              </button>
              <button onclick="location.href='../raporlar/raporlar.html?musteriId=${m.id}'" class="flex size-8 items-center justify-center rounded-lg bg-input text-muted-foreground hover:bg-black/5 transition-colors" title="Hesap Dökümü">
                <iconify-icon icon="solar:document-text-linear" width="16" height="16"></iconify-icon>
              </button>
              <button onclick="location.href='tel:${m.telefon}'" class="flex size-8 items-center justify-center rounded-lg bg-input text-muted-foreground hover:bg-black/5 transition-colors" title="Ara">
                <iconify-icon icon="solar:phone-calling-linear" width="16" height="16"></iconify-icon>
              </button>
            </div>
          </div>
          `;
        });
      }

      document.addEventListener('DOMContentLoaded', loadMusteriler);
    </script>
      <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('../sw.js', { scope: '../' }).catch((e) => console.warn('SW kaydı atlandı:', e));
        });
      }
    </script>
  </body>
</html>
