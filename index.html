<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">

<body style="margin:0; background:#F7F8FA; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display:flex; align-items:center; justify-content:center; height:100vh;">
    <p style="color:#667085; font-size:14px;">Ledger açılıyor... <a href="ana-sayfa/ana-sayfa.html" style="color:#263B73; font-weight:600;">Tıklayın</a></p>
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js', { scope: './' }).catch((e) => console.warn('SW kaydı atlandı:', e));
        });
      }
    </script>
</body>
